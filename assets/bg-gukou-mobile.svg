<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf3f8"/>
      <stop offset="0.5" stop-color="#f6edfb"/>
      <stop offset="1" stop-color="#e9f0fb"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.95"/>
      <stop offset="0.36" stop-color="#ffe9b8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b99ad0" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#b99ad0" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eebdd2" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#eebdd2" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <g id="blossom">
      <ellipse cx="0" cy="-7" rx="4.6" ry="7" fill="#f7a8c4"/>
      <ellipse cx="0" cy="-7" rx="4.6" ry="7" fill="#f7a8c4" transform="rotate(72)"/>
      <ellipse cx="0" cy="-7" rx="4.6" ry="7" fill="#f7a8c4" transform="rotate(144)"/>
      <ellipse cx="0" cy="-7" rx="4.6" ry="7" fill="#f7a8c4" transform="rotate(216)"/>
      <ellipse cx="0" cy="-7" rx="4.6" ry="7" fill="#f7a8c4" transform="rotate(288)"/>
      <circle r="2.5" fill="#ffe4a8"/>
    </g>
  </defs>

  <rect width="750" height="1200" fill="url(#sky)"/>

  <circle cx="565" cy="205" r="230" fill="url(#halo)"/>
  <circle cx="565" cy="205" r="66" fill="#fffaf0" opacity="0.9" filter="url(#soft2)"/>
  <circle cx="565" cy="205" r="55" fill="#fffdf6" opacity="0.96"/>

  <g filter="url(#soft)" opacity="0.48">
    <ellipse cx="470" cy="280" rx="230" ry="22" fill="#ffffff"/>
    <ellipse cx="640" cy="350" rx="180" ry="18" fill="#ffffff"/>
  </g>

  <g fill="#d9b25a">
    <circle cx="90" cy="120" r="1.5" opacity="0.55"/>
    <circle cx="240" cy="86" r="1.2" opacity="0.45"/>
    <circle cx="420" cy="140" r="1.6" opacity="0.5"/>
    <circle cx="690" cy="110" r="1.3" opacity="0.45"/>
    <circle cx="150" cy="300" r="1.2" opacity="0.4"/>
    <circle cx="710" cy="420" r="1.4" opacity="0.4"/>
  </g>

  <path d="M0 880 C 120 800 210 850 330 810 C 450 770 560 840 670 800 C 710 786 730 794 750 788 L750 1200 L0 1200Z" fill="url(#m1)"/>
  <path d="M0 1010 C 160 940 300 1000 450 960 C 600 920 690 990 750 960 L750 1200 L0 1200Z" fill="url(#m2)"/>

  <g stroke="#9a7a86" fill="none" stroke-linecap="round" opacity="0.42">
    <path d="M-30 90 C 60 130 120 120 190 155 C 235 177 275 170 330 195" stroke-width="3.5"/>
    <path d="M80 125 C 115 98 155 92 195 80" stroke-width="2.3"/>
    <path d="M185 140 C 220 118 255 112 290 100" stroke-width="1.8"/>
  </g>

  <g opacity="0.62">
    <g transform="translate(100,122) scale(1.1)"><use href="#blossom"/></g>
    <g transform="translate(185,82) scale(0.92)"><use href="#blossom"/></g>
    <g transform="translate(255,150) scale(1.15)"><use href="#blossom"/></g>
    <g transform="translate(320,192) scale(1)"><use href="#blossom"/></g>
    <g transform="translate(140,158) scale(0.85)"><use href="#blossom"/></g>
  </g>

  <g fill="#f4a2c0" opacity="0.5">
    <ellipse cx="210" cy="430" rx="6.5" ry="3.2" transform="rotate(25 210 430)"/>
    <ellipse cx="520" cy="520" rx="6" ry="3" transform="rotate(-32 520 520)"/>
    <ellipse cx="130" cy="640" rx="5.5" ry="2.8" transform="rotate(38 130 640)"/>
    <ellipse cx="620" cy="720" rx="6.5" ry="3.2" transform="rotate(-18 620 720)"/>
    <ellipse cx="350" cy="760" rx="5" ry="2.6" transform="rotate(28 350 760)"/>
  </g>

  <rect width="750" height="1200" filter="url(#grain)" opacity="0.035"/>
</svg>
