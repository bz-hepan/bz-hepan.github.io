<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf3f8"/>
      <stop offset="0.52" stop-color="#f5ecfa"/>
      <stop offset="1" stop-color="#e8effb"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffe9b8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b99ad0" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#b99ad0" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfb0dd" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#cfb0dd" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="m3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eebdd2" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#eebdd2" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <g id="blossom">
      <ellipse cx="0" cy="-7" rx="4.6" ry="7" fill="#f7a8c4"/>
      <ellipse cx="0" cy="-7" rx="4.6" ry="7" fill="#f7a8c4" transform="rotate(72)"/>
      <ellipse cx="0" cy="-7" rx="4.6" ry="7" fill="#f7a8c4" transform="rotate(144)"/>
      <ellipse cx="0" cy="-7" rx="4.6" ry="7" fill="#f7a8c4" transform="rotate(216)"/>
      <ellipse cx="0" cy="-7" rx="4.6" ry="7" fill="#f7a8c4" transform="rotate(288)"/>
      <circle r="2.5" fill="#ffe4a8"/>
    </g>
  </defs>

  <rect width="1440" height="900" fill="url(#sky)"/>

  <circle cx="1130" cy="170" r="250" fill="url(#halo)"/>
  <circle cx="1130" cy="170" r="74" fill="#fffaf0" opacity="0.9" filter="url(#soft2)"/>
  <circle cx="1130" cy="170" r="62" fill="#fffdf6" opacity="0.96"/>

  <g filter="url(#soft)" opacity="0.5">
    <ellipse cx="980" cy="252" rx="270" ry="26" fill="#ffffff"/>
    <ellipse cx="1290" cy="312" rx="210" ry="20" fill="#ffffff"/>
    <ellipse cx="420" cy="198" rx="230" ry="22" fill="#ffffff" opacity="0.65"/>
  </g>

  <g fill="#d9b25a">
    <circle cx="160" cy="90" r="1.6" opacity="0.55"/>
    <circle cx="300" cy="140" r="1.2" opacity="0.45"/>
    <circle cx="520" cy="80" r="1.8" opacity="0.5"/>
    <circle cx="700" cy="130" r="1.2" opacity="0.4"/>
    <circle cx="860" cy="70" r="1.5" opacity="0.5"/>
    <circle cx="1020" cy="110" r="1.2" opacity="0.45"/>
    <circle cx="1330" cy="92" r="1.7" opacity="0.5"/>
    <circle cx="80" cy="232" r="1.3" opacity="0.4"/>
    <circle cx="640" cy="220" r="1.1" opacity="0.4"/>
    <circle cx="760" cy="300" r="1.4" opacity="0.35"/>
  </g>

  <path d="M0 600 C 160 520 260 570 400 530 C 560 480 660 560 820 520 C 980 480 1120 560 1280 510 C 1360 485 1400 500 1440 490 L1440 900 L0 900Z" fill="url(#m1)"/>
  <path d="M0 690 C 180 620 340 670 520 630 C 700 590 860 660 1040 620 C 1220 580 1340 650 1440 620 L1440 900 L0 900Z" fill="url(#m2)"/>
  <path d="M0 790 C 220 720 460 780 680 740 C 900 700 1120 770 1440 720 L1440 900 L0 900Z" fill="url(#m3)"/>

  <g stroke="#9a7a86" fill="none" stroke-linecap="round" opacity="0.42">
    <path d="M-30 40 C 80 90 150 80 240 120 C 300 146 350 140 420 170" stroke-width="4"/>
    <path d="M90 78 C 130 50 180 44 230 30" stroke-width="2.5"/>
    <path d="M200 105 C 240 80 280 74 320 60" stroke-width="2"/>
    <path d="M320 145 C 350 120 380 112 410 100" stroke-width="1.8"/>
  </g>

  <g opacity="0.62">
    <g transform="translate(120,72) scale(1.15)"><use href="#blossom"/></g>
    <g transform="translate(215,38) scale(0.95)"><use href="#blossom"/></g>
    <g transform="translate(268,88) scale(1.2)"><use href="#blossom"/></g>
    <g transform="translate(342,132) scale(1)"><use href="#blossom"/></g>
    <g transform="translate(400,168) scale(1.1)"><use href="#blossom"/></g>
    <g transform="translate(180,104) scale(0.85)"><use href="#blossom"/></g>
    <g transform="translate(300,64) scale(0.9)"><use href="#blossom"/></g>
  </g>

  <g fill="#f4a2c0" opacity="0.5">
    <ellipse cx="520" cy="350" rx="7" ry="3.5" transform="rotate(25 520 350)"/>
    <ellipse cx="660" cy="470" rx="6" ry="3" transform="rotate(-35 660 470)"/>
    <ellipse cx="830" cy="330" rx="7" ry="3.5" transform="rotate(15 830 330)"/>
    <ellipse cx="960" cy="430" rx="5.5" ry="2.8" transform="rotate(-20 960 430)"/>
    <ellipse cx="380" cy="520" rx="6.5" ry="3.2" transform="rotate(40 380 520)"/>
    <ellipse cx="1180" cy="520" rx="6" ry="3" transform="rotate(-15 1180 520)"/>
    <ellipse cx="240" cy="660" rx="5" ry="2.6" transform="rotate(30 240 660)"/>
    <ellipse cx="1320" cy="690" rx="6" ry="3" transform="rotate(-28 1320 690)"/>
  </g>

  <rect width="1440" height="900" filter="url(#grain)" opacity="0.035"/>
</svg>
